# ---------------------------------------------------------------------------
# GradientForestMultiSpecies configuration
# ---------------------------------------------------------------------------

# Tab-separated sample sheet, one row per species. Each species has its own
# popmap and latlongs files, named with a species prefix (e.g.
# taffinis_id_to_pop.txt, taffinis_pop_latlongs.csv); to add a species, add
# its files and one row here. Columns:
#   species   short name, no spaces (used in output paths)
#   vcf       genotype VCF (plain or bgzipped)
#   popmap    whitespace-delimited table with header: sampleid popid
#   latlongs  CSV with header: popid,sitename,lat,long
#   id_regex  optional column; regex removed from VCF sample IDs before matching popmap
#             (e.g. ^MCZA_). Leave the column out if the IDs already match.
#   min_ind_per_pop  optional column; minimum individuals for a population to be kept
#             for this species (overrides genotypes.min_ind_per_pop; blank = default)
samples: config/samples.tsv

outdir: results

env:
  # directory holding one raster per environmental variable
  dir: /n/holylfs05/LABS/informatics/Lab/projects/afreedman/pire/data/worldclim
  pattern: "*.asc"
  # regex applied to each file name; group 1 is the variable number -> "bio<N>".
  # Set name_template: "{0}" and use a regex whose group 1 is the full name for non-bioclim layers.
  name_regex: "bio_?(\\d+)"
  name_template: "bio{0}"
  # study area: any vector file readable by GDAL/OGR (shp, gpkg, geojson) ...
  clip: /n/holylfs05/LABS/informatics/Lab/projects/afreedman/pire/data/bounding_box/PIREbb.shp
  # ... or a plain bounding box (used only if clip is empty): [xmin, ymin, xmax, ymax]
  bbox: []
  # country boundaries drawn on the turnover map: "naturalearth" (Natural Earth 1:10m
  # Admin 0, public domain, downloaded once), a path to any vector file, or "none"
  boundaries: naturalearth
  # aggregate the prediction grid by this factor (1 = native 30 arc-sec)
  grid_aggregate: 1
  # 0 = value of the cell containing the site; > 0 = mean of cells within this radius
  site_buffer_km: 0
  # if a site falls on a NA cell (e.g. coastline), use the nearest valid cell within this distance
  max_snap_km: 5

predictors:
  include: all            # "all" or a list such as [bio1, bio2, bio12]
  # Of two variables with |Pearson r| above corr_threshold at the sites, keep only
  # the one ranked higher; no two kept variables are correlated above it. null = keep all.
  corr_threshold: 0.8
  # How variables are ranked:
  #   importance  - R^2-weighted importance in a screening gradient forest fitted with
  #                 all candidate variables (the one that fits the SNPs better is kept)
  #   accuracy    - the same, using accuracy importance
  #   correlation - least correlated with the other variables first (ignores the SNPs)
  # The randomized fits use the selected variables, so tests are conditional on this model.
  rank_by: importance
  screen_ntree: 500       # trees in the screening fit
  keep_priority: []       # variables ranked first, so kept unless correlated with each other
  # Diagnostic: repeat the selection once per population, leaving that population out,
  # and report in qc.html how often each variable is kept (sensitivity of the choice to
  # the sampled populations). Costs one screening fit per population. The model always
  # uses the full-data selection.
  stability: true
  # To skip selection and use every candidate variable: sbatch run_slurm.sh --use-all-predictors
  # (or snakemake ... --config use_all_predictors=true); results go to <outdir>_all_predictors.
  # Importance floor (default: none): after selection, also drop variables whose share of
  # the summed screening importance is below a fraction, e.g. 1%:
  #   sbatch run_slurm.sh --importance-floor 0.01   (or --config importance_floor=0.01)
  # Results go to <outdir>_importance_floor0.01. Not combinable with --use-all-predictors.

genotypes:
  min_ind_per_pop: 5          # populations with fewer genotyped individuals are dropped;
                              # default for species with no min_ind_per_pop in the sample sheet
  # no MAF or missingness filters: gradient forest leaves out SNPs without signal
  # (R^2 <= 0), and only SNPs in the model are tested

pca:
  # Genotype PCA (results/<species>/pca/; population structure and sample QC, not used
  # by gradient forest). An individual is flagged in qc.html and ringed on the plots when,
  # on the first n_pcs PCs, it is at least min_ratio times closer to another population's
  # median than to its own AND farther than min_spread_ratio times its own population's
  # usual distance from its median.
  population_check:
    n_pcs: 4
    min_ratio: 2
    min_spread_ratio: 3

admixture:
  # ADMIXTURE ancestry proportions (results/<species>/admixture/; population structure,
  # not used by gradient forest). Same individuals and SNPs as the genotype PCA (no MAF,
  # missingness or LD filter). ADMIXTURE is run `replicates` times (different seeds) at
  # every K from k_min to k_max with cv_folds-fold cross-validation; the K with the
  # lowest mean CV error is selected. pong groups the replicate runs at each K into
  # modes (runs whose clusters match with similarity > pong_sim_threshold); K counts as
  # stable when pong's largest mode holds at least stable_min_frac of the runs. qc.html
  # warns when the selected K is not stable and shows K - 1 as well.
  enabled: true
  k_min: 1
  k_max: 10               # at most 20
  replicates: 100         # many runs per K, so pong's modes show how often runs agree
  cv_folds: 10
  seed: 1                 # replicate r uses seed + r - 1
  threads: 4
  pong_sim_threshold: 0.97
  stable_min_frac: 0.9    # 0.9 = at least 90% of runs in pong's largest mode (1.0 = all)

gf:
  # number of trees per forest, used for the observed fit and every randomized fit.
  # "auto": start at ntree_tuning.start and multiply by ntree_tuning.factor until two
  # successive fits agree (all three criteria below) or ntree_tuning.max is reached
  # (then a warning goes to the gf_fit log and qc.html). An integer fixes ntree.
  ntree: auto
  ntree_tuning:
    start: 250
    factor: 2
    max: 4000
    min_snp_rsq_cor: 0.98        # Pearson r of per-SNP R^2 between successive fits
    max_importance_change: 0.05  # max |change| in any predictor's R^2-weighted importance / total importance
    min_turnover_cor: 0.99       # Pearson r of pairwise turnover distances among n_cells random grid cells
    n_cells: 1500
  maxLevel: auto          # "auto" = floor(log2(0.368 * nSites / 2)), min 1
  corr_threshold: 0.5
  nbin: 201
  n_random: 1000          # number of randomized (permuted-environment) fits used as the null
  random_batch_size: 10   # randomized fits run sequentially within one SLURM job
  seed: 1
  pca_vars: all           # "all" or an integer: use the top-N most important predictors for the PCA / RGB map
  biplot_max_points: 50000
  # Refit using only the predictors whose importance beats the randomized fits.
  # The full model above is still fitted and remains the primary test; the refit
  # (with its own ntree tuning and n_random randomizations) is written to
  # results/<species>/<subdir>/. Its p-values are conditional on predictors chosen
  # from the same data, so they are optimistic; use it for maps, turnover space and
  # SNP-level R^2 without the noise predictors.
  refit_significant:
    enabled: true
    alpha: 0.05                       # keep a predictor if empirical p <= alpha ...
    metrics: [importance, accuracy]   # ... for any of these (R^2-weighted importance, accuracy importance)
    min_predictors: 2                 # stop with an error if fewer predictors pass
    subdir: refit_sigvars
